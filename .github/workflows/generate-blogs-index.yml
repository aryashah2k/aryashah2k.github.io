name: Generate Blogs Index

on:
  push:
    branches: [ main, master ]
    paths:
      - 'blogs/**'
      - 'scripts/generate-blogs-index.js'
      - '.github/workflows/generate-blogs-index.yml'
  workflow_dispatch:

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blogs/index.json
        run: |
          node scripts/generate-blogs-index.js

      - name: Commit and push changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add blogs/index.json
            git commit -m "chore(blogs): update index.json [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
